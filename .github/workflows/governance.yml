name: Governance of governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Governance-of-governance gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate governance ownership
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -ne 'pull_request') {
            Write-Host 'Manual run: no pull request to validate.'
            exit 0
          }

          # Use the PR files API rather than HEAD^1, so multi-commit PRs work.
          $files = @(gh api --paginate "repos/$env:REPO/pulls/$env:PR_NUMBER/files" --jq '.[].filename')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list PR files.' }
          if ($files -notcontains 'governance/owners.yml') {
            Write-Host 'No change to governance/owners.yml; governance gate passed.'
            exit 0
          }

          # Authoritative policy comes from the protected base branch, never the PR.
          $encoded = gh api "repos/$env:REPO/contents/governance/owners.yml?ref=main" --jq '.content'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($encoded)) {
            throw 'Cannot read governance/owners.yml from main.'
          }
          $yamlText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encoded -replace '\s', '')))

          # Restrict to the course's documented YAML structure.
          $lines = $yamlText -split "`n"
          $inEnvironments = $false
          $inGovernance = $false
          $inOwners = $false
          $owners = @()
          foreach ($line in $lines) {
            $line = $line.TrimEnd("`r")
            if ($line -match '^environments:\s*(?:#.*)?$') { $inEnvironments = $true; continue }
            if (-not $inEnvironments) { continue }
            if ($line -match '^\S' -and $line -notmatch '^environments:') { break }
            if ($line -match '^  ([\w-]+):\s*(?:#.*)?$') {
              $inGovernance = ($Matches[1] -eq 'governance')
              $inOwners = $false
              continue
            }
            if (-not $inGovernance) { continue }
            if ($line -match '^    owners:\s*(?:#.*)?$') { $inOwners = $true; continue }
            if ($line -match '^    \S' -and $line -notmatch '^    owners:') { $inOwners = $false }
            if ($inOwners -and $line -match '^      -\s+([A-Za-z0-9-]+)\s*(?:#.*)?$') {
              $owners += $Matches[1].ToLowerInvariant()
            }
          }
          $owners = @($owners | Select-Object -Unique)
          if ($owners.Count -eq 0) {
            throw 'GOVERNANCE BOOTSTRAP REQUIRED: no governance owners defined on main.'
          }

          # Check PR author AND the account performing the latest head push.
          # This is an actor gate, not a substitute for independent PR approval.
          $pr = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read PR metadata.' }
          $author = [string]$pr.user.login
          $headSha = [string]$pr.head.sha
          $commit = gh api "repos/$env:REPO/commits/$headSha" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read head commit metadata.' }
          $pusher = [string]$commit.author.login
          if ([string]::IsNullOrWhiteSpace($pusher)) {
            throw 'Cannot verify the GitHub identity associated with the head commit.'
          }
          Write-Host "Governance owners on main: $($owners -join ', ')"
          Write-Host "PR author: $author; head commit author: $pusher"
          if ($owners -notcontains $author.ToLowerInvariant() -or $owners -notcontains $pusher.ToLowerInvariant()) {
            throw 'GOVERNANCE BLOCK: PR author and head commit author must be existing governance owners.'
          }
          Write-Host 'Governance-of-governance gate PASSED.'
